ShortDescription: Free universal media downloader for Windows -- tray app that wraps yt-dlp + gallery-dl.
Description: |-
  GRAB is a calm, always-available system-tray downloader for filmmakers,
  reference gatherers, and anyone who's tired of manually driving yt-dlp
  or gallery-dl one URL at a time.

  Paste any link, get the file. GRAB auto-picks the right engine per URL
  (yt-dlp for video, gallery-dl for image galleries), falls back if the
  first engine can't handle it, and lays downloads out under
  <category>/<domain>/... on disk.

  - Works with ~1000 supported sites out of the box
  - Uses your Chrome / Firefox / Edge cookies for private content
  - Duplicate-safe (per-engine done-archive)
  - No telemetry, no ads, no premium tier
  - MIT-licensed; source at the URL below

  Bundled binaries (updated at build time from official upstream sources):
    - yt-dlp (nightly channel)
    - gallery-dl
    - ffmpeg (shared essentials build)

